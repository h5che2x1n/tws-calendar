name: Official source review
on:
  push:
    branches: [main]
    paths: ['sources/**', 'tests/test_sources.py', '.github/workflows/source-review.yml']
  schedule:
    - cron: '11 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python sources/scan.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-review
          path: source-report.json
          if-no-files-found: ignore

